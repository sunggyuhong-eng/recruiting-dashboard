.intro{padding:22px 0 30px}.intro .eyebrow{color:var(--lav)}.intro h1{margin:0;font-size:clamp(30px,4vw,48px);line-height:1.17;letter-spacing:-.065em;font-weight:820}.intro p:last-child{margin:11px 0 0;color:var(--muted);font-size:14px}.section-title{font-size:27px}.week-panel{background:#191820;gap:20px}.week-main{align-self:center}.weekly-side{justify-content:center}.weekly-head strong{font-size:16px}.weekly-people .person-chip{background:#23222d}.project-grid{gap:16px}.project-card{background:#18171e}.project-card summary{min-height:118px;padding:20px 23px;align-items:center}.project-card:has(details[open]){outline:1px solid #6d5b97;background:#1b1924}.project-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.project-name{font-size:20px}.project-preview{font-size:11px;line-height:1.4;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}.metric-pill{background:#2a2537}.metric-pill.expected{background:#20322d}.project-body{padding:0 23px 21px}.part-row{grid-template-columns:minmax(120px,1.15fr) minmax(115px,.7fr) minmax(190px,2.5fr);gap:13px;padding:14px 2px}.part-name{font-size:13px}.part-parent{display:block;color:var(--subtle);font-size:10px;font-weight:500;margin-top:2px}.part-counts{display:flex;flex-wrap:wrap;gap:2px 9px;color:var(--muted);font-size:10px}.part-counts b{color:#e8e5f1;font-size:11px}.part-counts .to-count b{color:var(--lav)}.part-people{align-items:center}.small-person{font-size:11px;background:#25242d;color:#eeeaf7}.small-person.expected{background:#2d263e;color:#e7ddff}.small-person.tbh{background:#29394a;color:#a6d6ff}.small-person.done{background:#1b2925;color:#bee9d7}.small-person time{font-size:10px}.project-card.inactive .metric-pill{background:#282830;color:var(--muted)}.weekly-side .fallback-title{font-size:12px;color:var(--subtle);margin-bottom:8px}.open-project{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px <body>
<main>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="kong-studios-logo.png" alt="KONG STUDIOS 로고"><div class="brand-copy"><strong>KONGSTUDIOS</strong><span>RECRUITING DASHBOARD</span></div></div>
  <div class="top-actions"><div class="select-wrap"><select id="projectFilter" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option></select></div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1c0x-dBPGGjDTPAXiO84-H-iwytpwy3WOAG05ogsXBuk/edit" target="_blank" rel="noopener">채용 시트 ↗</a><button class="icon-button" id="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button></div>
</header>
<div class="intro"><p class="eyebrow">RECRUITING / OVERVIEW</p><h1>채용의 흐름을 한눈에.</h1><p>프로젝트별 채용 TO와 입사 예정자를 한곳에서 확인하세요.</p></div>
<section class="week-panel" aria-labelledby="weeklyTitle">
  <div class="week-main"><div class="panel-heading"><div><p class="eyebrow">WEEKLY REPORT</p><h1 class="section-title" id="weeklyTitle">이번 주 채용 요약</h1></div><div class="week-switch"><button id="prevWeek" type="button" aria-label="이전 주">‹</button><span class="week-range" id="weekRange"></span><button id="nextWeek" type="button" aria-label="다음 주">›</button></div></div><div class="kpis" id="kpis"></div></div>
  <aside class="weekly-side"><div class="weekly-head"><strong>이번 주 입사 예정자</strong><span id="weeklyHint"></span></div><div class="weekly-people" id="weeklyPeople"></div></aside>
</section>
<section aria-labelledby="projectsTitle"><div class="section-head"><div><p class="eyebrow">PROJECT OVERVIEW</p><h2 class="section-title" id="projectsTitle">프로젝트별 채용 현황</h2></div><p class="section-hint">프로젝트를 선택하면 해당 파트의 채용 TO와 입사 예정자를 확인할 수 있어요.</p></div><div class="project-grid" id="projects" aria-live="polite"></div></section>
<div class="status-line" id="status" role="status" aria-live="polite"></div><p class="footer-note">채용승인신청서와 각 프로젝트 시트의 입력 내용을 기준으로 표시합니다.</p>
</main>
<script src="config.js"></script>
<script>
'use strict';
const API_URL=(typeof DATA_URL!=='undefined'&&DATA_URL)?DATA_URL:(window.DATA_URL||'');
const $=id=>document.getElementById(id);let data=null,weekOffset=0;
const PROJECT_TABS=['ZERO','HERO','OTPS','MAZE','N-GDTS','Art실','KongPlay','Server','IT Infra','QA','Publishing'];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const entrants=()=>Array.isArray(data?.entrants)?data.entrants:[];
const isoDate=value=>{if(!value)return '';if(typeof value==='number'||/^\d{5}$/.test(String(value))){const n=Number(value);return new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000).toISOString().slice(0,10);}const text=String(value);return /^\d{8}$/.test(text)?text.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):text.slice(0,10)};
const fmtDate=s=>{if(!s)return '일정 미정';const date=isoDate(s),d=new Date(`${date}T00:00:00+09:00`);return Number.isNaN(d.getTime())?String(s):new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).format(d)};
const weekBounds=()=>{const local=new Date(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00Z');const weekday=(local.getUTCDay()+6)%7;local.setUTCDate(local.getUTCDate()-weekday+weekOffset*7);const start=local.toISOString().slice(0,10);local.setUTCDate(local.getUTCDate()+6);return{start,end:local.toISOString().slice(0,10)}};
const within=(date,start,end)=>Boolean(date&&start<=date&&date<=end);
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function groupProjects(parts){const map=new Map();for(const raw of parts){if(!raw||typeof raw!=='object')continue;const project=String(raw.project||'').trim(),team=String(raw.team||'').trim();if(!project||!team)continue;if(!map.has(project))map.set(project,{project,parts:[]});map.get(project).parts.push({...raw,project,team,to:num(raw.to),hc:num(raw.hc),open:num(raw.open),planned:num(raw.planned)});}return [...map.values()];}
function normalizePayload(payload){
  if(!payload||payload.error)throw new Error(payload?.message||'공개 웹 앱에서 오류 응답을 반환했습니다.');
  if(!Array.isArray(payload.parts))throw new Error('API 응답에 파트 데이터가 없습니다. Apps Script 배포 버전을 확인해 주세요.');
  const flatParts=payload.parts.filter(p=>p&&typeof p==='object').map(p=>({...p,project:String(p.project||'').trim(),team:String(p.team||'').trim(),open:num(p.open),planned:num(p.planned)})).filter(p=>p.project&&p.team);
  const supplied=Array.isArray(payload.projects)?payload.projects.filter(p=>p&&p.project).map(p=>({project:String(p.project).trim(),parts:Array.isArray(p.parts)?p.parts.filter(Boolean).map(r=>({...r,project:String(r.project||p.project).trim(),team:String(r.team||'').trim(),open:num(r.open),planned:num(r.planned)})).filter(r=>r.team):[]})):[];
  const base=supplied.length?supplied:groupProjects(flatParts);
  // 구버전 API 호환: 알려진 시트 중 데이터가 반환된 프로젝트만 추가합니다.
  const byName=new Map(base.map(p=>[p.project,p]));
  if(!supplied.length)for(const name of PROJECT_TABS)if(!byName.has(name)){const matches=flatParts.filter(r=>r.project===name);if(matches.length)byName.set(name,{project:name,parts:matches});}
  const projects=[...byName.values()];
  if(!Array.isArray(payload.daily))payload.daily=[];if(Array.isArray(payload.entrants))payload.entrants=payload.entrants.map(p=>({...p,date:isoDate(p.date)}));
  if(!Array.isArray(payload.entrants)){const list=[];for(const part of flatParts){const raw=String(part.arrivals||'').trim();if(!raw)continue;for(const item of raw.split(/\s*[·•]\s*/)){const t=item.trim(),m=t.match(/^(.*?)\s*\((\d{4}-\d{2}-\d{2})\)$/),name=(m?m[1]:t).trim();if(name&&!/^[-—]+$/.test(name))list.push({name,date:m?m[2]:'',project:part.project,team:part.team,status:'입사예정'});}}payload.entrants=list;payload.legacy=true;}else payload.legacy=false;
  payload.projects=projects;payload.parts=projects.flatMap(p=>p.parts);payload.receivedProjectCount=Number.isFinite(Number(payload.projectCount))?Number(payload.projectCount):projects.length;
  if(!payload.projects.length)throw new Error('프로젝트 시트 데이터가 비어 있습니다. Apps Script가 프로젝트 시트를 읽는지 확인해 주세요.');
  return payload;
}
function metric(label,value,note,accent=false){const card=el('div',undefined,`kpi${accent?' accent':''}`);card.append(el('div',label,'kpi-label'));const valueNode=el('div',undefined,'kpi-value');valueNode.append(document.createTextNode(String(value)),el('span','명'));card.append(valueNode,el('div',note,'kpi-note'));return card;}
function renderWeekly(projects){
  const {start,end}=weekBounds(),names=new Set(projects.map(p=>p.project));
  $('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;
  const open=data.parts.filter(p=>names.has(p.project)).reduce((s,p)=>s+num(p.open),0);
  const incoming=entrants().filter(p=>p.status==='입사예정'&&within(p.date,start,end)&&names.has(p.project));
  const completed=data.legacy?data.daily.filter(p=>within(p.day,start,end)&&names.has(p.project)).reduce((s,p)=>s+num(p.count),0):entrants().filter(p=>p.status==='채용완료'&&within(p.date,start,end)&&names.has(p.project)).length;
  $('kpis').replaceChildren(metric('채용 중인 TO',open,'진행 중 승인 인원',true),metric('이번 주 입사 예정',incoming.length,'예정일 기준'),metric('이번 주 입사 완료',completed,'입사 처리 완료 기준'));
  const list=$('weeklyPeople');list.replaceChildren();
  if(incoming.length){$('weeklyHint').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;for(const p of incoming.sort((a,b)=>a.date.localeCompare(b.date))){const chip=el('div',undefined,'person-chip');chip.append(el('b',p.name||'이름 미기재'),el('small',`${p.project} · ${p.team} · ${fmtDate(p.date)}`));list.append(chip);}return;}
  $('weeklyHint').textContent='';list.append(el('div','이번 주 입사 예정자는 없습니다. 현재 진행 중인 채용입니다.','fallback-title'));
  const active=projects.map(p=>({name:p.project,open:p.parts.reduce((n,r)=>n+num(r.open),0)})).filter(p=>p.open>0).sort((a,b)=>b.open-a.open).slice(0,3);
  if(!active.length){list.append(el('div','현재 진행 중인 채용이 없습니다.','empty-inline'));return;}
  for(const p of active){const row=el('div',undefined,'open-project');row.append(el('span',p.name),el('b',`${p.open}명 채용 중`));list.append(row);}
}
function renderProjects(){
  if(!data)return;const selected=$('projectFilter').value,projects=data.projects.filter(p=>!selected||p.project===selected);renderWeekly(projects);
  const root=$('projects');root.replaceChildren();if(!projects.length){root.append(el('div','선택한 프로젝트의 데이터가 없습니다.','project-empty'));return;}
  for(const item of projects){
    const upcoming=entrants().filter(p=>p.project===item.project&&p.status==='입사예정');
    const activeCount=item.parts.reduce((n,p)=>n+num(p.open),0),plannedCount=item.parts.reduce((n,p)=>n+num(p.planned),0)||upcoming.length;
    const card=el('article',undefined,`project-card${activeCount||plannedCount?'':' inactive'}`),details=document.createElement('details'),summary=document.createElement('summary');
    const title=el('span',undefined,'project-title');title.append(el('span',item.project,'project-name'));
    const focus=item.parts.filter(p=>num(p.open)>0||num(p.planned)>0).map(p=>p.team);
    title.append(el('span',focus.length?focus.slice(0,3).join(' · ')+(focus.length>3?` 외 ${focus.length-3}개 파트`:''):'현재 진행 중인 채용 없음','project-preview'));summary.append(title);
    const pills=el('span',undefined,'project-metrics'),openPill=el('span',undefined,'metric-pill');openPill.append(document.createTextNode('채용 중 '),el('em',`${activeCount}명`));pills.append(openPill);
    if(plannedCount){const plannedPill=el('span',undefined,'metric-pill expected');plannedPill.append(document.createTextNode('입사 예정 '),el('em',`${plannedCount}명`));pills.append(plannedPill);}
    summary.append(pills,el('span','⌄','chevron'));
    const body=el('div',undefined,'project-body'),parts=el('div',undefined,'parts');
    if(!item.parts.length)parts.append(el('div','프로젝트 파트 데이터를 받지 못했습니다. Apps Script를 새 버전으로 배포해 주세요.','part-empty'));
    for(const p of item.parts){
      const row=el('div',undefined,'part-row'),label=el('div',undefined,'part-name');label.append(document.createTextNode(p.team));if(p.parent)label.append(el('span',p.parent,'part-parent'));row.append(label);
      const roster=Array.isArray(p.roster)?p.roster:[],present=roster.filter(x=>x.status==='재직'),tbh=roster.filter(x=>x.status==='TBH'),expected=roster.filter(x=>x.status==='입사예정');
      const stats=el('div',undefined,'part-counts');for(const [title,count,cls] of [['전체 TO',num(p.to),'to-count'],['재직',num(p.hc),''],['TBH',tbh.length,''],['입사 예정',Math.max(expected.length,num(p.planned)),'']]){const line=el('span',undefined,cls);line.append(document.createTextNode(title+' '),el('b',String(count)));stats.append(line);}row.append(stats);
      const people=el('div',undefined,'part-people');
      for(const person of roster){const status=person.status||'재직';if(!person.name&&status!=='TBH')continue;const chip=el('span',undefined,`small-person${status==='TBH'?' tbh':status==='입사예정'?' expected':status==='채용완료'?' done':''}`);chip.append(document.createTextNode(person.name||'TBH'));if(status==='입사예정')chip.append(el('time',fmtDate(person.date)));if(person.code)chip.title=`채용승인 ${person.code}${person.reason?' · '+person.reason:''}`;people.append(chip);}
      if(!roster.length)people.append(el('span','명단 데이터가 없습니다. Apps Script를 새 버전으로 배포해 주세요.','no-people'));
      row.append(people);parts.append(row);
    }
    body.append(parts);details.append(summary,body);card.append(details);root.append(card);
  }
}
function status(message,error=false){const node=$('status');node.replaceChildren();if(!error)node.append(el('span',undefined,'status-dot'));node.append(document.createTextNode(message));node.classList.toggle('error',error);}
async function load(){if(!API_URL){status('config.js의 DATA_URL에 현재 공개 웹 앱 주소가 설정되어 있는지 확인해 주세요.',true);return;}const button=$('refresh');button.disabled=true;status('스프레드시트 데이터를 불러오는 중입니다.');try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error(`공개 웹 앱 응답 오류 (HTTP ${response.status})`);let payload;try{payload=await response.json();}catch{throw new Error('웹 앱 응답이 JSON이 아닙니다. Apps Script 공개 배포 URL을 확인해 주세요.');}data=normalizePayload(payload);const select=$('projectFilter'),old=select.value;select.replaceChildren(new Option('전체 프로젝트',''));for(const p of data.projects)select.add(new Option(p.project,p.project));select.value=[...select.options].some(o=>o.value===old)?old:'';renderProjects();const stamp=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});status(`${data.receivedProjectCount}개 프로젝트 연결 · ${stamp}`,data.receivedProjectCount<data.projects.length);}catch(error){status(error.message||'데이터를 불러오지 못했습니다. 공개 웹 앱과 접근 설정을 확인해 주세요.',true);}finally{button.disabled=false;}}
$('refresh').addEventListener('click',load);$('projectFilter').addEventListener('change',renderProjects);$('prevWeek').addEventListener('click',()=>{weekOffset--;if(data)renderProjects();});$('nextWeek').addEventListener('click',()=>{weekOffset++;if(data)renderProjects();});load();
</script>
