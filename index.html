<style>
:root{--bg:#0b0b0f;--surface:#15151b;--surface2:#1c1c24;--surface3:#22222b;--line:#2b2b35;--text:#f5f4fa;--muted:#a09fac;--subtle:#777785;--lav:#c9b9ff;--lavbg:#292338;--blue:#80baff;--mint:#80dfbd;--mintbg:#18342d;--red:#ff9daa;--radius:20px}
*{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.025em;-webkit-font-smoothing:antialiased}button,select{font:inherit}button{cursor:pointer}a{color:inherit}main{max-width:1200px;margin:auto;padding:30px 30px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:24px;margin-bottom:27px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:16px;min-width:0}.brand-logo{display:block;width:108px;height:64px;object-fit:contain;border-radius:8px;background:#050506}.brand-copy{display:grid;gap:2px}.brand-copy strong{font-size:15px;letter-spacing:.055em;font-weight:800}.brand-copy span{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:9px}.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:13px;top:8px;color:var(--muted);pointer-events:none}.select-wrap select,.sheet-link,.icon-button{height:40px;color:#e5e3ec;background:#17171d;border:1px solid var(--line);border-radius:11px;padding:0 13px;font-size:12px}.select-wrap select{appearance:none;padding-right:34px;max-width:190px}.sheet-link{display:inline-flex;align-items:center;text-decoration:none;font-weight:650}.icon-button{width:40px;padding:0;font-size:20px}.select-wrap select:hover,.sheet-link:hover,.icon-button:hover{border-color:#514b60}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:10px;line-height:1.3;letter-spacing:.15em;font-weight:800}.section-title{margin:0;font-size:23px;line-height:1.25;letter-spacing:-.055em;font-weight:780}.week-panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.85fr);gap:28px;padding:25px 27px;background:var(--surface);border-radius:var(--radius);margin-bottom:42px}.week-main{min-width:0}.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.week-switch{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.week-switch button{width:31px;height:31px;border:1px solid var(--line);background:var(--surface2);color:#eee;border-radius:50%;font-size:19px;line-height:1}.week-switch button:hover{border-color:var(--lav);color:var(--lav)}.week-range{min-width:126px;text-align:center;font-weight:650;color:#c6c4d1}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kpi{min-height:116px;padding:16px 17px;background:var(--surface2);border-radius:15px}.kpi.accent{background:var(--lavbg)}.kpi-label{font-size:12px;font-weight:650;color:#b9b7c4}.kpi.accent .kpi-label{color:#d8ccff}.kpi-value{margin-top:11px;font-size:31px;font-weight:800;letter-spacing:-.07em;line-height:1.1}.kpi-value span{margin-left:4px;font-size:14px;letter-spacing:-.02em;color:#c8c7d2}.kpi.accent .kpi-value{color:var(--lav)}.kpi-note{margin-top:6px;font-size:10px;color:var(--subtle)}.weekly-side{display:flex;flex-direction:column;min-width:0;padding:2px 0 0 25px;border-left:1px solid var(--line)}.weekly-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 0 13px}.weekly-head strong{font-size:14px}.weekly-head span{font-size:10px;color:var(--subtle)}.weekly-people{display:flex;flex-direction:column;gap:8px}.person-chip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface2)}.person-chip b{font-size:12px;font-weight:700;white-space:nowrap}.person-chip small{font-size:10px;color:var(--muted);text-align:right}.empty-inline{padding:11px 0;color:var(--subtle);font-size:12px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}.section-head .eyebrow{color:var(--lav)}.section-hint{margin:0 0 1px;color:var(--subtle);font-size:11px}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project-card{min-width:0;background:var(--surface);border-radius:17px;overflow:hidden;transition:background .16s ease}.project-card:hover{background:#191920}.project-card details{height:100%}.project-card summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:82px;padding:16px 19px;cursor:pointer}.project-card summary::-webkit-details-marker{display:none}.project-name{flex:1;min-width:0;font-size:16px;font-weight:760;letter-spacing:-.04em;overflow-wrap:anywhere}.project-metrics{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.metric-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--lavbg);color:#ded4ff;font-size:10px;font-weight:650;white-space:nowrap}.metric-pill em{font-style:normal;color:var(--lav);font-size:12px;font-weight:800}.metric-pill.expected{background:var(--mintbg);color:#b8ead8}.metric-pill.expected em{color:var(--mint)}.chevron{width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--surface3);color:#b9b7c4;font-size:14px;transition:transform .18s ease}.project-card details[open] .chevron{transform:rotate(180deg);background:#302a3c;color:var(--lav)}.project-body{padding:0 19px 18px}.parts{padding-top:3px;border-top:1px solid var(--line)}.part-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(100px,.7fr) minmax(150px,1.5fr);align-items:start;gap:12px;padding:12px 1px;border-bottom:1px solid #262630}.part-row:last-child{border-bottom:0}.part-name{padding-top:2px;font-size:12px;font-weight:700;overflow-wrap:anywhere}.open-count{font-size:11px;color:var(--muted);white-space:nowrap}.open-count strong{color:var(--lav);font-size:13px;font-weight:780}.part-people{display:flex;flex-wrap:wrap;gap:6px}.small-person{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;background:#211d2b;color:#e2d9ff;border-radius:8px;font-size:10px}.small-person time{color:#aaa3bc;font-size:9px;white-space:nowrap}.small-person.done{background:#1b2925;color:#bee9d7}.no-people,.part-empty{color:var(--subtle);font-size:11px}.part-empty{padding:15px 2px}.project-empty{grid-column:1/-1;padding:25px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px}.status-line{display:flex;justify-content:center;align-items:center;min-height:24px;margin-top:16px;color:var(--subtle);font-size:10px;text-align:center}.status-line.error{color:var(--red)}.status-dot{width:6px;height:6px;flex:0 0 auto;margin:0 7px 1px 0;background:var(--mint);border-radius:50%}.footer-note{text-align:center;color:#686875;font-size:10px;margin-top:18px}
@media(max-width:850px){.week-panel{grid-template-columns:1fr;gap:19px}.weekly-side{padding:17px 0 0;border-left:0;border-top:1px solid var(--line)}.weekly-people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.part-row{grid-template-columns:minmax(100px,1fr) minmax(95px,.7fr);gap:7px}.part-people{grid-column:1/-1;padding-left:1px}}
@media(max-width:650px){main{padding:19px 14px 46px}.topbar{align-items:flex-start;gap:12px;padding-bottom:18px;margin-bottom:20px}.brand{gap:9px}.brand-logo{width:76px;height:46px}.brand-copy strong{font-size:11px}.brand-copy span{font-size:8px;letter-spacing:.1em}.top-actions{gap:6px}.select-wrap select{max-width:126px;height:36px;padding:0 28px 0 9px;font-size:10px}.sheet-link{display:none}.icon-button{width:36px;height:36px}.week-panel{padding:18px 14px;gap:15px;margin-bottom:31px;border-radius:17px}.panel-heading{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:13px}.section-title{font-size:19px}.week-switch{align-self:flex-end;margin-top:-38px}.week-range{min-width:110px;font-size:10px}.kpis{gap:6px}.kpi{min-height:89px;padding:12px 9px;border-radius:12px}.kpi-label{font-size:10px}.kpi-value{font-size:23px;margin-top:9px}.kpi-value span{font-size:11px}.kpi-note{font-size:8px}.weekly-side{padding-top:14px}.weekly-head{align-items:flex-start;flex-direction:column;gap:3px;margin-bottom:9px}.weekly-people{grid-template-columns:1fr}.person-chip{padding:9px 10px}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.section-title{font-size:19px}.section-hint{font-size:10px}.project-grid{grid-template-columns:1fr;gap:9px}.project-card{border-radius:14px}.project-card summary{min-height:70px;padding:13px 12px;gap:8px}.project-name{font-size:13px}.project-metrics{gap:4px}.metric-pill{padding:4px 6px;font-size:9px}.metric-pill em{font-size:10px}.chevron{width:23px;height:23px}.project-body{padding:0 12px 13px}.part-row{grid-template-columns:minmax(100px,1fr) auto;gap:6px;padding:10px 1px}.part-name{font-size:11px}.open-count{font-size:10px;text-align:right}.open-count strong{font-size:12px}.part-people{grid-column:1/-1}.small-person{font-size:10px}.status-line{font-size:9px}}
@media(max-width:360px){.brand-logo{width:65px;height:40px}.brand-copy strong{font-size:10px}.brand-copy span{font-size:7px}.select-wrap select{max-width:108px}.kpi-value{font-size:20px}.project-metrics{max-width:160px}}
</style>
</head>
<body>
<main>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="kong-studios-logo.png" alt="KONG STUDIOS 로고"><div class="brand-copy"><strong>KONGSTUDIOS</strong><span>RECRUITING DASHBOARD</span></div></div>
  <div class="top-actions"><div class="select-wrap"><select id="projectFilter" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option></select></div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1c0x-dBPGGjDTPAXiO84-H-iwytpwy3WOAG05ogsXBuk/edit" target="_blank" rel="noopener">채용 시트 ↗</a><button class="icon-button" id="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button></div>
</header>
<section class="week-panel" aria-labelledby="weeklyTitle">
  <div class="week-main"><div class="panel-heading"><div><p class="eyebrow">WEEKLY REPORT</p><h1 class="section-title" id="weeklyTitle">이번 주 채용 요약</h1></div><div class="week-switch"><button id="prevWeek" type="button" aria-label="이전 주">‹</button><span class="week-range" id="weekRange"></span><button id="nextWeek" type="button" aria-label="다음 주">›</button></div></div><div class="kpis" id="kpis"></div></div>
  <aside class="weekly-side"><div class="weekly-head"><strong>이번 주 입사 예정자</strong><span id="weeklyHint"></span></div><div class="weekly-people" id="weeklyPeople"></div></aside>
</section>
<section aria-labelledby="projectsTitle"><div class="section-head"><div><p class="eyebrow">PROJECT OVERVIEW</p><h2 class="section-title" id="projectsTitle">프로젝트별 채용 현황</h2></div><p class="section-hint">프로젝트를 선택하면 해당 파트의 채용 TO와 입사 예정자를 확인할 수 있어요.</p></div><div class="project-grid" id="projects" aria-live="polite"></div></section>
<div class="status-line" id="status" role="status" aria-live="polite"></div><p class="footer-note">채용승인신청서와 각 프로젝트 시트의 입력 내용을 기준으로 표시합니다.</p>
</main>
<script src="config.js"></script>
<script>
'use strict';
const API_URL=(typeof DATA_URL!=='undefined'&&DATA_URL)?DATA_URL:(window.DATA_URL||'');
const $=id=>document.getElementById(id);let data=null,weekOffset=0;
const PROJECT_TABS=['ZERO','HERO','OTPS','MAZE','N-GDTS','Art실','KongPlay','Server','IT Infra','QA','Publishing'];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const entrants=()=>Array.isArray(data?.entrants)?data.entrants:[];
const fmtDate=s=>{if(!s)return '일정 미정';const d=new Date(`${s}T00:00:00+09:00`);return Number.isNaN(d.getTime())?String(s):new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).format(d)};
const weekBounds=()=>{const local=new Date(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00Z');const weekday=(local.getUTCDay()+6)%7;local.setUTCDate(local.getUTCDate()-weekday+weekOffset*7);const start=local.toISOString().slice(0,10);local.setUTCDate(local.getUTCDate()+6);return{start,end:local.toISOString().slice(0,10)}};
const within=(date,start,end)=>Boolean(date&&start<=date&&date<=end);
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function groupProjects(parts){const map=new Map();for(const raw of parts){if(!raw||typeof raw!=='object')continue;const project=String(raw.project||'').trim(),team=String(raw.team||'').trim();if(!project||!team)continue;if(!map.has(project))map.set(project,{project,parts:[]});map.get(project).parts.push({...raw,project,team,to:num(raw.to),hc:num(raw.hc),open:num(raw.open),planned:num(raw.planned)});}return [...map.values()];}
function normalizePayload(payload){
  if(!payload||payload.error)throw new Error(payload?.message||'공개 웹 앱에서 오류 응답을 반환했습니다.');
  if(!Array.isArray(payload.parts))throw new Error('API 응답에 파트 데이터가 없습니다. Apps Script 배포 버전을 확인해 주세요.');
  const flatParts=payload.parts.filter(p=>p&&typeof p==='object').map(p=>({...p,project:String(p.project||'').trim(),team:String(p.team||'').trim(),open:num(p.open),planned:num(p.planned)})).filter(p=>p.project&&p.team);
  const supplied=Array.isArray(payload.projects)?payload.projects.filter(p=>p&&p.project).map(p=>({project:String(p.project).trim(),parts:Array.isArray(p.parts)?p.parts.filter(Boolean).map(r=>({...r,project:String(r.project||p.project).trim(),team:String(r.team||'').trim(),open:num(r.open),planned:num(r.planned)})).filter(r=>r.team):[]})):[];
  const base=supplied.length?supplied:groupProjects(flatParts);
  // 구버전 API 호환: 알려진 시트 중 데이터가 반환된 프로젝트만 추가합니다.
  const byName=new Map(base.map(p=>[p.project,p]));
  if(!supplied.length)for(const name of PROJECT_TABS)if(!byName.has(name)){const matches=flatParts.filter(r=>r.project===name);if(matches.length)byName.set(name,{project:name,parts:matches});}
  const projects=[...byName.values()];
  if(!Array.isArray(payload.daily))payload.daily=[];
  if(!Array.isArray(payload.entrants)){const list=[];for(const part of flatParts){const raw=String(part.arrivals||'').trim();if(!raw)continue;for(const item of raw.split(/\s*[·•]\s*/)){const t=item.trim(),m=t.match(/^(.*?)\s*\((\d{4}-\d{2}-\d{2})\)$/),name=(m?m[1]:t).trim();if(name&&!/^[-—]+$/.test(name))list.push({name,date:m?m[2]:'',project:part.project,team:part.team,status:'입사예정'});}}payload.entrants=list;payload.legacy=true;}else payload.legacy=false;
  payload.projects=projects;payload.parts=projects.flatMap(p=>p.parts);payload.receivedProjectCount=Number.isFinite(Number(payload.projectCount))?Number(payload.projectCount):projects.length;
  if(!payload.projects.length)throw new Error('프로젝트 시트 데이터가 비어 있습니다. Apps Script가 프로젝트 시트를 읽는지 확인해 주세요.');
  return payload;
}
function metric(label,value,note,accent=false){const card=el('div',undefined,`kpi${accent?' accent':''}`);card.append(el('div',label,'kpi-label'));const valueNode=el('div',undefined,'kpi-value');valueNode.append(document.createTextNode(String(value)),el('span','명'));card.append(valueNode,el('div',note,'kpi-note'));return card;}
function renderWeekly(projects){const{start,end}=weekBounds();$('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;const names=new Set(projects.map(p=>p.project));const relevant=data.parts.filter(p=>names.has(p.project));const open=relevant.reduce((s,p)=>s+num(p.open),0);const incoming=entrants().filter(x=>x.status==='입사예정'&&within(x.date,start,end)&&names.has(x.project));const completed=data.legacy?data.daily.filter(x=>within(x.day,start,end)&&names.has(x.project)).reduce((s,x)=>s+num(x.count),0):entrants().filter(x=>x.status==='채용완료'&&within(x.date,start,end)&&names.has(x.project)).length;$('kpis').replaceChildren(metric('채용 중인 TO',open,'진행 중 승인 인원',true),metric('이번 주 입사 예정',incoming.length,'예정일 기준'),metric('이번 주 입사 완료',completed,'입사 처리 완료 기준'));$('weeklyHint').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;const list=$('weeklyPeople');list.replaceChildren();if(!incoming.length){list.append(el('div','이번 주 입사 예정자가 없습니다.','empty-inline'));return;}for(const p of incoming.sort((a,b)=>(a.date||'').localeCompare(b.date||''))){const chip=el('div',undefined,'person-chip');chip.append(el('b',p.name||'이름 미기재'),el('small',`${p.project} · ${p.team} · ${fmtDate(p.date)}`));list.append(chip);}}
function renderProjects(){if(!data)return;const selected=$('projectFilter').value;const projects=data.projects.filter(p=>!selected||p.project===selected);renderWeekly(projects);const root=$('projects');root.replaceChildren();if(!projects.length){root.append(el('div','선택한 프로젝트의 데이터가 없습니다.','project-empty'));return;}for(const item of projects){const upcoming=entrants().filter(x=>x.project===item.project&&x.status==='입사예정');const completed=entrants().filter(x=>x.project===item.project&&x.status==='채용완료');const activeCount=item.parts.reduce((s,p)=>s+num(p.open),0);const plannedCount=item.parts.reduce((s,p)=>s+num(p.planned),0)||upcoming.length;const card=el('article',undefined,'project-card');const details=document.createElement('details');const summary=document.createElement('summary');summary.append(el('span',item.project,'project-name'));const pills=el('span',undefined,'project-metrics');const openPill=el('span',undefined,'metric-pill');openPill.append(document.createTextNode('채용 중 '),el('em',`${activeCount}명`));const plannedPill=el('span',undefined,'metric-pill expected');plannedPill.append(document.createTextNode('입사 예정 '),el('em',`${plannedCount}명`));pills.append(openPill,plannedPill);summary.append(pills,el('span','⌄','chevron'));const body=el('div',undefined,'project-body'),parts=el('div',undefined,'parts');const visible=item.parts.filter(p=>num(p.open)>0||num(p.planned)>0||entrants().some(x=>x.project===item.project&&x.team===p.team));if(!item.parts.length)parts.append(el('div','프로젝트 시트에서 파트별 데이터를 받지 못했습니다.','part-empty'));else if(!visible.length)parts.append(el('div','현재 채용 중이거나 입사 예정인 파트가 없습니다.','part-empty'));for(const p of visible){const row=el('div',undefined,'part-row');row.append(el('div',p.team,'part-name'));const count=el('div',undefined,'open-count');count.append(document.createTextNode('채용 중 '),el('strong',`${num(p.open)}명`));row.append(count);const people=el('div',undefined,'part-people');const matched=entrants().filter(x=>x.project===item.project&&x.team===p.team&&['입사예정','채용완료'].includes(x.status)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));if(matched.length){for(const person of matched){const chip=el('span',undefined,`small-person${person.status==='채용완료'?' done':''}`);chip.append(document.createTextNode(person.name||'이름 미기재'),el('time',`${person.status} · ${fmtDate(person.date)}`));people.append(chip);}}else people.append(el('span',num(p.planned)>0?'입사예정자 정보 확인 필요':'입사 예정자 없음','no-people'));row.append(people);parts.append(row);}if(completed.length&&!item.parts.some(p=>entrants().some(x=>x.project===item.project&&x.team===p.team&&x.status==='채용완료'))){const row=el('div',undefined,'part-row');row.append(el('div','채용 완료','part-name'),el('div','', 'open-count'));const people=el('div',undefined,'part-people');for(const person of completed){const chip=el('span',undefined,'small-person done');chip.append(document.createTextNode(person.name||'이름 미기재'),el('time',`채용완료 · ${fmtDate(person.date)}`));people.append(chip);}row.append(people);parts.append(row);}body.append(parts);details.append(summary,body);card.append(details);root.append(card);}}
function status(message,error=false){const node=$('status');node.replaceChildren();if(!error)node.append(el('span',undefined,'status-dot'));node.append(document.createTextNode(message));node.classList.toggle('error',error);}
async function load(){if(!API_URL){status('config.js의 DATA_URL에 현재 공개 웹 앱 주소가 설정되어 있는지 확인해 주세요.',true);return;}const button=$('refresh');button.disabled=true;status('스프레드시트 데이터를 불러오는 중입니다.');try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error(`공개 웹 앱 응답 오류 (HTTP ${response.status})`);let payload;try{payload=await response.json();}catch{throw new Error('웹 앱 응답이 JSON이 아닙니다. Apps Script 공개 배포 URL을 확인해 주세요.');}data=normalizePayload(payload);const select=$('projectFilter'),old=select.value;select.replaceChildren(new Option('전체 프로젝트',''));for(const p of data.projects)select.add(new Option(p.project,p.project));select.value=[...select.options].some(o=>o.value===old)?old:'';renderProjects();const stamp=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});status(`${data.receivedProjectCount}개 프로젝트 연결 · ${stamp}`,data.receivedProjectCount<data.projects.length);}catch(error){status(error.message||'데이터를 불러오지 못했습니다. 공개 웹 앱과 접근 설정을 확인해 주세요.',true);}finally{button.disabled=false;}}
$('refresh').addEventListener('click',load);$('projectFilter').addEventListener('change',renderProjects);$('prevWeek').addEventListener('click',()=>{weekOffset--;if(data)renderProjects();});$('nextWeek').addEventListener('click',()=>{weekOffset++;if(data)renderProjects();});load();
</script>
