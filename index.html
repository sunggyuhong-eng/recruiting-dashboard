<body>
<main>
<header class="topbar"><a class="brand" href="./" aria-label="대시보드 홈으로 이동"><img class="brand-logo" src="kong-studios-logo.png" alt="KONG STUDIOS 로고"><div class="brand-copy"><strong>KONGSTUDIOS</strong><span>RECRUITING DASHBOARD</span></div></a><div class="top-actions"><div class="select-wrap"><select id="projectFilter" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option></select></div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1c0x-dBPGGjDTPAXiO84-H-iwytpwy3WOAG05ogsXBuk/edit" target="_blank" rel="noopener">채용 시트 ↗</a><span class="refresh-status" id="refreshStatus" role="status" aria-live="polite"></span><button class="icon-button" id="refresh" type="button" aria-label="새로고침" title="새로고침"><span aria-hidden="true">↻</span></button></div></header>
<section class="hero" aria-labelledby="summaryTitle"><div class="hero-top"><div><p class="eyebrow">RECRUITING STATUS</p><h1 id="summaryTitle">현재 채용 중인 TO</h1></div><div class="week-switch"><button id="prevWeek" type="button" aria-label="이전 주">‹</button><span id="weekRange" class="week-range"></span><button id="nextWeek" type="button" aria-label="다음 주">›</button></div></div><div class="hero-main"><div class="primary-metrics"><div><div class="hero-number"><span id="openCount">—</span><small>명</small></div><p class="hero-note">채용승인신청서에 등록된 진행 중 인원</p></div><div class="pipeline-metric"><div class="pipeline-label">채용 진행 중</div><div class="pipeline-value"><span id="pipelineCount">—</span><small>명</small></div><div class="pipeline-note" id="pipelineNote">채용중 시트 · 지정 단계 기준</div></div></div><div class="secondary-metrics"><div class="mini-metric"><div class="mini-label" id="weeklyLabel">이번 주 입사자</div><div class="mini-value"><span id="completedCount">—</span><span>명</span></div><div class="mini-note">채용완료 · 예정일 기준</div><div class="weekly-people" id="weeklyPeople"></div></div><div class="mini-metric"><div class="mini-label">전체 입사 예정자</div><div class="mini-value"><span id="upcomingCount">—</span><span>명</span></div><div class="mini-note">입사예정 상태의 명단</div></div></div></div><div class="incoming-panel"><div class="incoming-head"><strong>입사 예정자 명단</strong><span id="incomingHint"></span></div><div class="incoming-list" id="incomingList"></div></div></section>
<section aria-labelledby="projectsTitle"><div class="section-head"><div><p class="eyebrow">PROJECTS</p><h2 id="projectsTitle">프로젝트별 채용 현황</h2></div><p class="section-hint">프로젝트를 펼치면 모든 파트의 TO와 명단을 확인할 수 있습니다.</p></div><div class="project-list" id="projects"></div></section>
<div class="status-line" id="status" role="status" aria-live="polite"></div><p class="footer-note">채용승인신청서 및 프로젝트 시트 기준</p>
</main>

<script>
'use strict';
const API_URL=(typeof DATA_URL!=='undefined'&&DATA_URL)?DATA_URL:(window.DATA_URL||'');
const $=id=>document.getElementById(id);let data=null,weekOffset=0;
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const isoDate=value=>{if(!value)return '';if(typeof value==='number'||/^\d{5}$/.test(String(value)))return new Date(Date.UTC(1899,11,30)+Math.floor(Number(value))*86400000).toISOString().slice(0,10);const s=String(value);return /^\d{8}$/.test(s)?s.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):s.slice(0,10)};
const fmtDate=s=>{if(!s)return '일정 미정';const d=new Date(`${isoDate(s)}T00:00:00+09:00`);return Number.isNaN(d.getTime())?String(s):new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).format(d)};
const weekBounds=()=>{const d=new Date(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7+weekOffset*7);const start=d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()+6);return{start,end:d.toISOString().slice(0,10)}};
const within=(date,start,end)=>Boolean(date&&start<=date&&date<=end);
const entrants=()=>Array.isArray(data?.entrants)?data.entrants:[];
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function normalizePayload(payload){
  if(!payload||payload.error)throw Error(payload?.message||'공개 웹 앱 오류');
  if(!Array.isArray(payload.parts))throw Error('파트 데이터를 받지 못했습니다. Apps Script 배포를 확인해 주세요.');
  const normalizePart=p=>({...p,project:String(p.project||'').trim(),team:String(p.team||'').trim(),to:num(p.to),hc:num(p.hc),open:num(p.open),planned:num(p.planned),roster:Array.isArray(p.roster)?p.roster.map(r=>({...r,date:isoDate(r.date)})):[]});
  const parts=payload.parts.filter(p=>p&&p.project&&p.team).map(normalizePart),groups=new Map();
  for(const p of parts){if(!groups.has(p.project))groups.set(p.project,{project:p.project,parts:[]});groups.get(p.project).parts.push(p);}
  const supplied=Array.isArray(payload.projects)?payload.projects.filter(p=>p&&p.project).map(p=>({project:String(p.project).trim(),parts:Array.isArray(p.parts)?p.parts.filter(r=>r&&r.team).map(r=>normalizePart({...r,project:p.project})):[]})):[];
  const projects=supplied.length?supplied:[...groups.values()];
  payload.projects=projects;payload.parts=projects.flatMap(p=>p.parts);payload.entrants=Array.isArray(payload.entrants)?payload.entrants.map(p=>({...p,date:isoDate(p.date)})):[];payload.daily=Array.isArray(payload.daily)?payload.daily:[];payload.approvals=Array.isArray(payload.approvals)?payload.approvals:[];
  if(!projects.length)throw Error('프로젝트 데이터가 없습니다.');return payload;
}
function renderSummary(projects){
  const selected=new Set(projects.map(p=>p.project)),{start,end}=weekBounds();
  $('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;
  $('weeklyLabel').textContent=weekOffset===0?'이번 주 입사자':'선택한 주 입사자';
  $('openCount').textContent=projects.flatMap(p=>p.parts).reduce((s,p)=>s+num(p.open),0);
  const selectedProject=$('projectFilter').value,pipeline=data.pipeline;
  $('pipelineCount').textContent=pipeline&&Number.isFinite(Number(pipeline.total))?(selectedProject?num(pipeline.byProject?.[selectedProject]):num(pipeline.total)):'—';
  $('pipelineNote').textContent=!pipeline?'집계 API 업데이트 필요':selectedProject?'채용중 시트 · PJ 일치 기준':'채용중 시트 · 지정 단계 기준';
  const planned=entrants().filter(p=>p.status==='입사예정'&&selected.has(p.project)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const completed=entrants().filter(p=>p.status==='채용완료'&&selected.has(p.project)&&within(p.date,start,end));
  const weekList=$('weeklyPeople');weekList.replaceChildren();
  if(completed.length){for(const p of completed){const chip=el('span',undefined,'weekly-person');chip.append(el('b',p.name||'이름 미기재'),el('small',p.project));weekList.append(chip);}}else weekList.append(el('span','해당 주 입사자 없음','weekly-empty'));
  $('completedCount').textContent=completed.length;$('upcomingCount').textContent=planned.length;
  $('incomingHint').textContent=planned.length?`${planned.length}명 · 예정일 순`:'';
  const list=$('incomingList');list.replaceChildren();if(!planned.length){list.append(el('span','등록된 입사 예정자가 없습니다.','empty'));return;}
  for(const p of planned){const item=el('span',undefined,'incoming-person');item.append(el('b',p.name||'이름 미기재'),el('small',`${p.project} · ${p.team} · ${fmtDate(p.date)}`));list.append(item);}
}
function rosterTable(project){
  const wrapper=el('div',undefined,'table-scroll'),table=el('table',undefined,'roster-table'),head=document.createElement('thead'),tr=document.createElement('tr');
  for(const title of ['파트','전체 TO','재직','명단'])tr.append(el('th',title));head.append(tr);table.append(head);
  const body=document.createElement('tbody');
  for(const p of project.parts){const row=document.createElement('tr'),name=el('td');name.append(el('span',p.team,'part-name'));if(p.parent)name.append(el('span',p.parent,'part-parent'));row.append(name);
    const roster=Array.isArray(p.roster)?p.roster:[];
    for(const [value,cls] of [[num(p.to),'to'],[num(p.hc),'']]){const cell=el('td');cell.append(el('span',String(value),`count ${cls}`));row.append(cell);}
    const cell=el('td'),people=el('div',undefined,'people');
    const registered=entrants().filter(e=>e.project===project.project&&e.team===p.team&&e.name);
    const visibleRoster=roster.slice();
    for(const e of registered)if(!roster.some(r=>r.name&&r.name.trim()===e.name.trim()))visibleRoster.push({name:e.name,status:e.status,date:e.date,code:e.code});
    for(const person of visibleRoster){
      const linked=registered.find(e=>person.name&&e.name.trim()===person.name.trim()&&(!person.code||!e.code||String(e.code)===String(person.code)));
      const state=linked?.status||person.status||'재직';
      if(!person.name&&state!=='TBH')continue;
      const chip=el('span',undefined,`person${state==='TBH'?' tbh':state==='입사예정'?' expected':''}`);
      chip.append(document.createTextNode(person.name||'TBH'));
      if(state==='입사예정'){chip.append(el('span','(입사예정)','expected-label'));chip.append(el('time',fmtDate(linked?.date||person.date)));}
      if(person.code&&state!=='TBH')chip.title=`채용승인 ${person.code}${person.reason?' · '+person.reason:''}`;
      people.append(chip);
    }
    if(!visibleRoster.length)people.append(el('span','명단 정보 없음','missing'));cell.append(people);row.append(cell);body.append(row);
  }
  if(!project.parts.length){const row=el('tr'),cell=el('td','프로젝트 파트 데이터를 받지 못했습니다.','project-empty');cell.colSpan=4;row.append(cell);body.append(row);}
  table.append(body);wrapper.append(table);return wrapper;
}
function approvalSection(project){
  const section=el('section',undefined,'approval-section'),head=el('div',undefined,'approval-head');head.append(el('h3','채용 중인 TO 상세'),el('span','채용승인신청서 기준'));section.append(head);
  const list=el('div',undefined,'approval-list'),rows=data.approvals.filter(a=>a.project===project.project&&num(a.open)>0);
  if(!rows.length){list.append(el('div',project.parts.some(p=>num(p.open)>0)?'승인신청서 상세 정보가 없습니다. PublicDashboard.gs를 새 버전으로 배포해 주세요.':'현재 채용 중인 TO가 없습니다.','empty'));}
  for(const a of rows){const row=el('div',undefined,'approval-row'),team=el('div',undefined,'approval-team');team.append(document.createTextNode(a.team),el('small',`${num(a.open)}명 채용 중${a.code?' · '+a.code:''}`));row.append(team,el('div',a.reason||'채용 사유 미기재','approval-reason'));
    const url=String(a.url||'').trim();if(/^https?:\/\//i.test(url)){const link=el('a','승인신청서 열기 ↗','approval-link');link.href=url;link.target='_blank';link.rel='noopener noreferrer';row.append(link);}else row.append(el('span','링크 없음','approval-unavailable'));list.append(row);
  }
  section.append(list);return section;
}
function renderProjects(){if(!data)return;const selected=$('projectFilter').value,projects=data.projects.filter(p=>!selected||p.project===selected);renderSummary(projects);const root=$('projects');root.replaceChildren();
  for(const project of projects){const to=project.parts.reduce((s,p)=>s+num(p.to),0),hc=project.parts.reduce((s,p)=>s+num(p.hc),0),planned=entrants().filter(p=>p.status==='입사예정'&&p.project===project.project),names=planned.map(p=>p.name).filter(Boolean);
    const article=el('article',undefined,'project-row'),details=document.createElement('details'),summary=document.createElement('summary'),title=el('span',undefined,'project-title');title.append(el('span',project.project,'project-name'));
    const overview=el('span',undefined,'project-overview');overview.append(document.createTextNode('전체 TO '),el('b',`${to}명`),document.createTextNode(` (현재 ${hc}명 재직 중)`));title.append(overview);
    if(planned.length){const arrival=el('span',undefined,'project-arrivals');arrival.append(document.createTextNode('입사 예정 '),el('b',`${planned.length}명`),document.createTextNode(` (${names.join(', ')})`));title.append(arrival);}summary.append(title,el('span','⌄','chevron'));
    const content=el('div',undefined,'project-body');content.append(rosterTable(project),approvalSection(project));details.append(summary,content);article.append(details);root.append(article);
  }
  if(!projects.length)root.append(el('div','표시할 프로젝트가 없습니다.','project-empty'));
}
function status(message,error=false){const n=$('status');n.textContent=message;n.classList.toggle('error',error);}
function refreshState(message,error=false){const n=$('refreshStatus');n.textContent=message;n.classList.toggle('error',error);}
async function load(manual=false){
  if(!API_URL){status('config.js의 공개 웹 앱 주소를 확인해 주세요.',true);refreshState('연결 설정 확인',true);return;}
  const button=$('refresh');button.disabled=true;button.classList.add('loading');button.setAttribute('aria-label','새로고침 중');
  refreshState(manual?'새로고침 중…':'불러오는 중…');status('데이터를 불러오는 중입니다.');
  try{
    const separator=API_URL.includes('?')?'&':'?';
    const response=await fetch(`${API_URL}${separator}v=${Date.now()}`,{cache:'no-store'});
    if(!response.ok)throw Error(`웹 앱 응답 오류 (HTTP ${response.status})`);
    data=normalizePayload(await response.json());
    const select=$('projectFilter'),old=select.value;select.replaceChildren(new Option('전체 프로젝트',''));
    for(const p of data.projects)select.add(new Option(p.project,p.project));
    select.value=[...select.options].some(o=>o.value===old)?old:'';renderProjects();
    const now=new Date(),time=now.toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    refreshState(`${manual?'새로고침 완료':'연결됨'} · ${time}`);
    status(`${data.projects.length}개 프로젝트 연결 · ${now.toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}`);
  }catch(e){refreshState(manual?'새로고침 실패':'연결 실패',true);status(e.message||'데이터를 불러오지 못했습니다.',true);}
  finally{button.disabled=false;button.classList.remove('loading');button.setAttribute('aria-label','새로고침');}
}
$('refresh').addEventListener('click',()=>load(true));$('projectFilter').addEventListener('change',renderProjects);$('prevWeek').addEventListener('click',()=>{weekOffset--;if(data)renderProjects()});$('nextWeek').addEventListener('click',()=>{weekOffset++;if(data)renderProjects()});load();
</script>
