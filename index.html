<title>KONGSTUDIOS Recruiting Dashboard</title>
<style>
:root{--bg:#090b12;--text:#f7f7fc;--muted:#a7a8b7;--subtle:#7c7e8e;--lav:#d0beff;--blue:#a9d7ff;--mint:#a8ecd2;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.025em;background:radial-gradient(ellipse 900px 600px at 8% -5%,rgba(112,82,192,.18),transparent 70%),radial-gradient(ellipse 800px 650px at 92% 27%,rgba(54,108,178,.12),transparent 73%),var(--bg);-webkit-font-smoothing:antialiased}button,select{font:inherit}button{cursor:pointer}a{color:inherit}main{max-width:1680px;margin:auto;padding:22px clamp(20px,3vw,52px) 72px}.eyebrow{margin:0 0 7px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.16em}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:15px}.brand-logo{width:96px;height:58px;object-fit:contain;border-radius:8px;background:#030306}.brand-copy{display:grid;gap:2px}.brand-copy strong{font-size:15px;font-weight:800;letter-spacing:.045em}.brand-copy span{font-size:10px;color:var(--muted);letter-spacing:.14em;font-weight:700}.top-actions{display:flex;gap:9px;align-items:center}.select-wrap{position:relative}.select-wrap:after{content:'⌄';position:absolute;right:13px;top:8px;color:var(--muted);pointer-events:none}.select-wrap select,.sheet-link,.icon-button,.week-switch button{height:40px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.07);color:var(--text);box-shadow:inset 0 1px rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}.select-wrap select{appearance:none;padding:0 34px 0 13px;max-width:210px}.sheet-link{display:inline-flex;align-items:center;text-decoration:none;padding:0 14px;font-size:12px;font-weight:700}.icon-button{width:40px;padding:0;font-size:20px}.top-actions :is(select,a,button):hover,.week-switch button:hover{border-color:rgba(208,190,255,.52)}.top-actions :is(select,a,button):focus-visible,.week-switch button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.hero{position:relative;overflow:hidden;margin-top:28px;padding:clamp(24px,3vw,42px);border:1px solid rgba(255,255,255,.12);border-radius:27px;background:linear-gradient(120deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 48%,rgba(133,110,203,.08));box-shadow:inset 0 1px rgba(255,255,255,.14),0 25px 65px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%)}.hero::before{content:'';position:absolute;right:-130px;top:-220px;width:700px;height:650px;background:radial-gradient(circle,rgba(142,118,236,.19),rgba(81,140,214,.08) 42%,transparent 72%);filter:blur(24px);pointer-events:none}.hero-top{position:relative;display:flex;align-items:start;justify-content:space-between;gap:18px}.hero h1{font-size:clamp(19px,2vw,27px);letter-spacing:-.055em;line-height:1.25;margin:0}.week-switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.week-switch button{width:32px;height:32px;border-radius:50%;font-size:19px;line-height:1}.week-range{min-width:130px;text-align:center;font-weight:650}.hero-main{position:relative;display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(300px,.9fr);gap:40px;align-items:end;margin-top:26px}.hero-number{display:flex;align-items:baseline;gap:13px;font-size:clamp(82px,10vw,156px);line-height:.96;letter-spacing:-.095em;font-weight:810;color:var(--lav);text-shadow:0 0 60px rgba(172,135,255,.17)}.hero-number small{font-size:clamp(24px,3vw,39px);font-weight:650;letter-spacing:-.04em;color:#e3d9ff}.hero-note{margin:13px 0 0;font-size:12px;color:var(--muted)}.secondary-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini-metric{padding:21px 21px 18px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:inset 0 1px rgba(255,255,255,.07)}.mini-label{font-size:13px;font-weight:700;color:#d4d4df}.mini-value{margin-top:11px;font-size:clamp(31px,3.5vw,49px);line-height:1;letter-spacing:-.07em;font-weight:780}.mini-value span{font-size:16px;margin-left:5px;letter-spacing:-.02em;color:var(--muted)}.mini-metric:last-child .mini-value{color:var(--mint)}.mini-note{margin-top:10px;color:var(--subtle);font-size:11px}.incoming-panel{position:relative;margin-top:29px;padding-top:21px;border-top:1px solid rgba(255,255,255,.12)}.incoming-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}.incoming-head strong{font-size:16px}.incoming-head span{font-size:11px;color:var(--muted)}.incoming-list{display:flex;flex-wrap:wrap;gap:9px}.incoming-person{display:inline-flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid rgba(185,164,250,.2);border-radius:11px;background:rgba(150,124,226,.12)}.incoming-person b{font-size:13px}.incoming-person small{font-size:11px;color:#c8c0df}.empty{font-size:12px;color:var(--muted);padding:7px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:42px 0 16px}.section-head .eyebrow{color:var(--lav)}.section-head h2{font-size:clamp(23px,2.3vw,31px);line-height:1.2;letter-spacing:-.055em;margin:0}.section-hint{margin:0;color:var(--muted);font-size:12px}.project-list{display:grid;gap:10px}.project-row{background:linear-gradient(115deg,rgba(255,255,255,.077),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.11);border-radius:17px;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.075);-webkit-backdrop-filter:blur(17px);backdrop-filter:blur(17px)}.project-row:hover{border-color:rgba(208,190,255,.3)}.project-row:has(details[open]){border-color:rgba(199,174,255,.38);background:linear-gradient(120deg,rgba(118,95,179,.16),rgba(255,255,255,.035) 35%)}.project-row summary{list-style:none;display:flex;align-items:center;gap:18px;min-height:76px;padding:14px 22px;cursor:pointer}.project-row summary::-webkit-details-marker{display:none}.project-title{display:flex;align-items:baseline;gap:18px;min-width:0;flex:1}.project-name{font-size:19px;font-weight:780;min-width:165px;letter-spacing:-.045em}.project-preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-meta{display:flex;gap:10px;align-items:center;flex:0 0 auto}.project-stat{font-size:12px;color:var(--muted);white-space:nowrap}.project-stat b{font-size:17px;color:var(--lav);margin-left:4px}.project-stat.planned b{color:var(--mint)}.project-stat + .project-stat{margin-left:16px}.chevron{display:grid;place-items:center;flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--muted);transition:transform .18s}.project-row details[open] .chevron{transform:rotate(180deg);color:var(--lav)}.project-body{padding:0 20px 20px}.table-scroll{overflow-x:auto;border:1px solid rgba(255,255,255,.11);border-radius:12px;background:rgba(6,8,16,.2)}.roster-table{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed}.roster-table th{padding:12px 13px;text-align:left;font-size:11px;color:#b8bac9;background:rgba(255,255,255,.065);font-weight:750}.roster-table td{padding:12px 13px;border-top:1px solid rgba(255,255,255,.085);vertical-align:top;font-size:12px}.roster-table th:nth-child(1){width:18%}.roster-table th:nth-child(2){width:8%}.roster-table th:nth-child(3){width:8%}.roster-table th:nth-child(4){width:8%}.roster-table th:nth-child(5){width:9%}.roster-table th:nth-child(6){width:49%}.roster-table tbody tr:hover{background:rgba(255,255,255,.035)}.part-name{font-weight:750;font-size:13px}.part-parent{display:block;font-size:10px;color:var(--subtle);font-weight:500;margin-top:3px}.count{font-weight:750;font-variant-numeric:tabular-nums}.count.to{color:var(--lav)}.count.tbh{color:var(--blue)}.people{display:flex;flex-wrap:wrap;gap:6px}.person{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:rgba(255,255,255,.075);border-radius:7px;color:#f0eef6;white-space:nowrap}.person.tbh{background:rgba(85,154,211,.2);color:#b9dcff}.person.expected{background:rgba(166,130,245,.22);color:#ebdfff}.person.done{background:rgba(73,162,128,.2);color:#c0f1dc}.person time,.person .code{font-size:10px;opacity:.8}.missing{color:var(--subtle);font-size:11px}.project-empty{padding:20px;color:var(--muted)}.status-line{text-align:center;color:var(--subtle);font-size:10px;margin-top:20px}.status-line.error{color:#ffa1ad}.footer-note{text-align:center;color:#666b79;font-size:10px;margin-top:16px}
@media(max-width:960px){.hero-main{gap:20px}.project-title{gap:10px}.project-name{min-width:130px}.project-stat + .project-stat{margin-left:3px}}
@media(max-width:720px){main{padding:16px 14px 50px}.topbar{padding-bottom:16px;align-items:flex-start}.brand{gap:9px}.brand-logo{width:72px;height:44px}.brand-copy strong{font-size:11px}.brand-copy span{font-size:8px}.sheet-link{display:none}.select-wrap select{max-width:125px;height:36px;font-size:11px}.icon-button{width:36px;height:36px}.hero{margin-top:18px;padding:21px 17px;border-radius:19px}.hero-top{flex-direction:column}.hero h1{font-size:20px}.week-switch{align-self:flex-end}.hero-main{grid-template-columns:1fr;gap:19px;margin-top:12px}.hero-number{font-size:87px}.hero-number small{font-size:26px}.hero-note{margin-top:5px}.mini-metric{padding:15px}.mini-value{font-size:35px}.incoming-panel{margin-top:19px;padding-top:16px}.incoming-head{align-items:flex-start;flex-direction:column;gap:3px}.section-head{align-items:flex-start;flex-direction:column;gap:5px;margin-top:32px}.section-head h2{font-size:23px}.project-row summary{padding:14px;gap:9px;min-height:78px}.project-title{display:grid;gap:3px}.project-name{font-size:16px}.project-preview{max-width:180px;font-size:10px}.project-meta{gap:6px}.project-stat{font-size:10px}.project-stat b{font-size:13px}.project-stat + .project-stat{margin-left:0}.chevron{width:24px;height:24px}.project-body{padding:0 12px 14px}.roster-table{min-width:850px}}
@media(max-width:420px){.project-preview{max-width:135px}.project-meta{flex-direction:column;align-items:flex-end}.project-stat b{font-size:12px}}
@media(prefers-reduced-motion:reduce){.chevron{transition:none}}
</style>
</head>
<body>
<main>
<header class="topbar"><div class="brand"><img class="brand-logo" src="kong-studios-logo.png" alt="KONG STUDIOS 로고"><div class="brand-copy"><strong>KONGSTUDIOS</strong><span>RECRUITING DASHBOARD</span></div></div><div class="top-actions"><div class="select-wrap"><select id="projectFilter" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option></select></div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1c0x-dBPGGjDTPAXiO84-H-iwytpwy3WOAG05ogsXBuk/edit" target="_blank" rel="noopener">채용 시트 ↗</a><button class="icon-button" id="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button></div></header>
<section class="hero" aria-labelledby="summaryTitle"><div class="hero-top"><div><p class="eyebrow">RECRUITING STATUS</p><h1 id="summaryTitle">현재 채용 중인 TO</h1></div><div class="week-switch"><button id="prevWeek" type="button" aria-label="이전 주">‹</button><span id="weekRange" class="week-range"></span><button id="nextWeek" type="button" aria-label="다음 주">›</button></div></div><div class="hero-main"><div><div class="hero-number"><span id="openCount">—</span><small>명</small></div><p class="hero-note">채용승인신청서에 등록된 진행 중 인원</p></div><div class="secondary-metrics"><div class="mini-metric"><div class="mini-label" id="weeklyLabel">이번 주 입사자</div><div class="mini-value"><span id="completedCount">—</span><span>명</span></div><div class="mini-note">채용완료 · 예정일 기준</div></div><div class="mini-metric"><div class="mini-label">전체 입사 예정자</div><div class="mini-value"><span id="upcomingCount">—</span><span>명</span></div><div class="mini-note">입사예정 상태의 명단</div></div></div></div><div class="incoming-panel"><div class="incoming-head"><strong>입사 예정자 명단</strong><span id="incomingHint"></span></div><div class="incoming-list" id="incomingList"></div></div></section>
<section aria-labelledby="projectsTitle"><div class="section-head"><div><p class="eyebrow">PROJECTS</p><h2 id="projectsTitle">프로젝트별 채용 현황</h2></div><p class="section-hint">프로젝트를 펼치면 모든 파트의 TO와 명단을 확인할 수 있습니다.</p></div><div class="project-list" id="projects"></div></section>
<div class="status-line" id="status" role="status" aria-live="polite"></div><p class="footer-note">채용승인신청서 및 프로젝트 시트 기준</p>
</main>
<script src="config.js"></script>
<script>
'use strict';
const API_URL=(typeof DATA_URL!=='undefined'&&DATA_URL)?DATA_URL:(window.DATA_URL||'');
const $=id=>document.getElementById(id);let data=null,weekOffset=0;
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const isoDate=value=>{if(!value)return '';if(typeof value==='number'||/^\d{5}$/.test(String(value)))return new Date(Date.UTC(1899,11,30)+Math.floor(Number(value))*86400000).toISOString().slice(0,10);const s=String(value);return /^\d{8}$/.test(s)?s.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):s.slice(0,10)};
const fmtDate=s=>{if(!s)return '일정 미정';const d=new Date(`${isoDate(s)}T00:00:00+09:00`);return Number.isNaN(d.getTime())?String(s):new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).format(d)};
const weekBounds=()=>{const d=new Date(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7+weekOffset*7);const start=d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()+6);return{start,end:d.toISOString().slice(0,10)}};
const within=(date,start,end)=>Boolean(date&&start<=date&&date<=end);
const entrants=()=>Array.isArray(data?.entrants)?data.entrants:[];
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function normalizePayload(payload){
  if(!payload||payload.error)throw Error(payload?.message||'공개 웹 앱 오류');
  if(!Array.isArray(payload.parts))throw Error('파트 데이터를 받지 못했습니다. Apps Script 배포를 확인해 주세요.');
  const normalizePart=p=>({...p,project:String(p.project||'').trim(),team:String(p.team||'').trim(),to:num(p.to),hc:num(p.hc),open:num(p.open),planned:num(p.planned),roster:Array.isArray(p.roster)?p.roster.map(r=>({...r,date:isoDate(r.date)})):[]});
  const parts=payload.parts.filter(p=>p&&p.project&&p.team).map(normalizePart),groups=new Map();
  for(const p of parts){if(!groups.has(p.project))groups.set(p.project,{project:p.project,parts:[]});groups.get(p.project).parts.push(p);}
  const supplied=Array.isArray(payload.projects)?payload.projects.filter(p=>p&&p.project).map(p=>({project:String(p.project).trim(),parts:Array.isArray(p.parts)?p.parts.filter(r=>r&&r.team).map(r=>normalizePart({...r,project:p.project})):[]})):[];
  const projects=supplied.length?supplied:[...groups.values()];
  payload.projects=projects;payload.parts=projects.flatMap(p=>p.parts);payload.entrants=Array.isArray(payload.entrants)?payload.entrants.map(p=>({...p,date:isoDate(p.date)})):[];payload.daily=Array.isArray(payload.daily)?payload.daily:[];
  if(!projects.length)throw Error('프로젝트 데이터가 없습니다.');return payload;
}
function renderSummary(projects){
  const selected=new Set(projects.map(p=>p.project)),{start,end}=weekBounds();
  $('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;
  $('weeklyLabel').textContent=weekOffset===0?'이번 주 입사자':'선택한 주 입사자';
  $('openCount').textContent=projects.flatMap(p=>p.parts).reduce((s,p)=>s+num(p.open),0);
  const planned=entrants().filter(p=>p.status==='입사예정'&&selected.has(p.project)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const completed=entrants().filter(p=>p.status==='채용완료'&&selected.has(p.project)&&within(p.date,start,end)).length;
  $('completedCount').textContent=completed;$('upcomingCount').textContent=planned.length;
  $('incomingHint').textContent=planned.length?`${planned.length}명 · 예정일 순`:'';
  const list=$('incomingList');list.replaceChildren();if(!planned.length){list.append(el('span','등록된 입사 예정자가 없습니다.','empty'));return;}
  for(const p of planned){const item=el('span',undefined,'incoming-person');item.append(el('b',p.name||'이름 미기재'),el('small',`${p.project} · ${p.team} · ${fmtDate(p.date)}`));list.append(item);}
}
function rosterTable(project){
  const wrapper=el('div',undefined,'table-scroll'),table=el('table',undefined,'roster-table'),head=document.createElement('thead'),tr=document.createElement('tr');
  for(const title of ['파트','전체 TO','재직','TBH','입사 예정','명단'])tr.append(el('th',title));head.append(tr);table.append(head);
  const body=document.createElement('tbody');
  for(const p of project.parts){const row=document.createElement('tr'),name=el('td');name.append(el('span',p.team,'part-name'));if(p.parent)name.append(el('span',p.parent,'part-parent'));row.append(name);
    const roster=Array.isArray(p.roster)?p.roster:[],tbh=roster.filter(r=>r.status==='TBH'),expected=roster.filter(r=>r.status==='입사예정');
    for(const [value,cls] of [[num(p.to),'to'],[num(p.hc),''],[tbh.length,'tbh'],[Math.max(expected.length,num(p.planned)),'']]){const cell=el('td');cell.append(el('span',String(value),`count ${cls}`));row.append(cell);}
    const cell=el('td'),people=el('div',undefined,'people');
    for(const person of roster){const state=person.status||'재직';if(!person.name&&state!=='TBH')continue;const chip=el('span',undefined,`person${state==='TBH'?' tbh':state==='입사예정'?' expected':state==='채용완료'?' done':''}`);chip.append(document.createTextNode(person.name||'TBH'));if(state==='입사예정')chip.append(el('time',fmtDate(person.date)));if(person.code){chip.append(el('span',person.code,'code'));chip.title=`채용승인 ${person.code}${person.reason?' · '+person.reason:''}`;}people.append(chip);}
    if(!roster.length)people.append(el('span','명단 정보 없음','missing'));cell.append(people);row.append(cell);body.append(row);
  }
  if(!project.parts.length){const row=el('tr'),cell=el('td','프로젝트 파트 데이터를 받지 못했습니다.','project-empty');cell.colSpan=6;row.append(cell);body.append(row);}
  table.append(body);wrapper.append(table);return wrapper;
}
function renderProjects(){if(!data)return;const selected=$('projectFilter').value,projects=data.projects.filter(p=>!selected||p.project===selected);renderSummary(projects);const root=$('projects');root.replaceChildren();
  for(const project of projects){const open=project.parts.reduce((s,p)=>s+num(p.open),0),planned=entrants().filter(p=>p.status==='입사예정'&&p.project===project.project).length,focus=project.parts.filter(p=>num(p.open)>0||num(p.planned)>0).map(p=>p.team);
    const article=el('article',undefined,'project-row'),details=document.createElement('details'),summary=document.createElement('summary'),title=el('span',undefined,'project-title');title.append(el('span',project.project,'project-name'),el('span',focus.length?focus.slice(0,4).join(' · ')+(focus.length>4?` 외 ${focus.length-4}개`:''):'진행 중인 채용 없음','project-preview'));summary.append(title);
    const meta=el('span',undefined,'project-meta'),openStat=el('span',undefined,'project-stat');openStat.append(document.createTextNode('채용 중'),el('b',`${open}명`));meta.append(openStat);if(planned){const plannedStat=el('span',undefined,'project-stat planned');plannedStat.append(document.createTextNode('입사 예정'),el('b',`${planned}명`));meta.append(plannedStat);}summary.append(meta,el('span','⌄','chevron'));
    const content=el('div',undefined,'project-body');content.append(rosterTable(project));details.append(summary,content);article.append(details);root.append(article);
  }
  if(!projects.length)root.append(el('div','표시할 프로젝트가 없습니다.','project-empty'));
}
function status(message,error=false){const n=$('status');n.textContent=message;n.classList.toggle('error',error);}
async function load(){if(!API_URL){status('config.js의 공개 웹 앱 주소를 확인해 주세요.',true);return;}const button=$('refresh');button.disabled=true;status('데이터를 불러오는 중입니다.');try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw Error(`웹 앱 응답 오류 (HTTP ${response.status})`);data=normalizePayload(await response.json());const select=$('projectFilter'),old=select.value;select.replaceChildren(new Option('전체 프로젝트',''));for(const p of data.projects)select.add(new Option(p.project,p.project));select.value=[...select.options].some(o=>o.value===old)?old:'';renderProjects();status(`${data.projects.length}개 프로젝트 연결 · ${new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}`);}catch(e){status(e.message||'데이터를 불러오지 못했습니다.',true);}finally{button.disabled=false;}}
$('refresh').addEventListener('click',load);$('projectFilter').addEventListener('change',renderProjects);$('prevWeek').addEventListener('click',()=>{weekOffset--;if(data)renderProjects()});$('nextWeek').addEventListener('click',()=>{weekOffset++;if(data)renderProjects()});load();
</script>
</body>
