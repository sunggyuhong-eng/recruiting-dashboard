<!doctype html>

<style>
:root{--bg:#0b0b0f;--panel:#15151b;--panel-2:#1c1c24;--line:#2b2b35;--text:#f5f4fa;--muted:#9b9ba9;--muted-2:#747482;--lav:#c7b5ff;--lav-bg:#292338;--blue:#80baff;--green:#7de0bc;--green-bg:#18352d;--red:#ff9caa;--radius:20px}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.025em;-webkit-font-smoothing:antialiased}button,select{font:inherit}button{cursor:pointer}a{color:inherit}main{max-width:1160px;margin:auto;padding:32px 30px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:27px;border-bottom:1px solid var(--line);margin-bottom:28px}.brand{display:flex;align-items:center;gap:17px;min-width:0}.brand-logo{display:block;width:116px;height:70px;object-fit:contain;border-radius:8px;background:#050506}.brand-copy{display:flex;flex-direction:column;gap:2px;min-width:0}.brand-copy strong{font-size:16px;letter-spacing:.045em;font-weight:800}.brand-copy span{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:9px}.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:13px;top:9px;color:var(--muted);pointer-events:none}.select-wrap select{appearance:none;color:var(--text);background:#17171d;border:1px solid var(--line);border-radius:11px;padding:10px 34px 10px 13px;font-size:13px;max-width:185px}.sheet-link,.icon-button{display:inline-flex;align-items:center;justify-content:center;background:#17171d;border:1px solid var(--line);border-radius:11px;color:#dfdfea;text-decoration:none;padding:10px 13px;font-size:13px;font-weight:650}.icon-button{width:40px;height:40px;padding:0;font-size:19px}.sheet-link:hover,.icon-button:hover,.select-wrap select:hover{border-color:#4b465c}.week-panel,.project-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.week-panel{padding:25px 27px 23px;margin-bottom:46px;box-shadow:0 18px 55px rgba(0,0,0,.16)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:19px}.eyebrow{margin:0 0 5px;color:var(--blue);font-size:11px;line-height:1.3;letter-spacing:.14em;font-weight:800}.panel-head h1,.section-title{font-size:22px;letter-spacing:-.055em;line-height:1.25;margin:0;font-weight:760}.week-switch{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.week-switch button{height:34px;width:34px;border:1px solid var(--line);background:#1b1b23;color:#e9e7f0;border-radius:50%;font-size:20px;line-height:1}.week-switch button:hover{border-color:var(--lav);color:var(--lav)}.week-range{font-weight:650;color:#c6c4d1;min-width:125px;text-align:center}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kpi{padding:18px 20px 16px;background:var(--panel-2);border:1px solid #292933;border-radius:16px;min-height:112px}.kpi:first-child{background:var(--lav-bg);border-color:#544b6e}.kpi-label{font-size:13px;font-weight:650;color:#b7b6c3}.kpi:first-child .kpi-label{color:#d4caff}.kpi-value{font-size:31px;font-weight:790;letter-spacing:-.065em;line-height:1.2;margin-top:10px}.kpi-value span{font-size:15px;margin-left:4px;letter-spacing:-.02em;color:#c8c7d2}.kpi:first-child .kpi-value{color:var(--lav)}.kpi-note{font-size:11px;color:var(--muted-2);margin-top:5px}.weekly-list{border-top:1px solid var(--line);margin-top:19px;padding-top:16px}.weekly-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.weekly-list-head strong{font-size:13px;font-weight:700}.weekly-list-head span{font-size:11px;color:var(--muted-2)}.weekly-people{display:flex;flex-wrap:wrap;gap:8px}.person-chip{display:inline-flex;align-items:center;gap:9px;background:#1b1b23;border:1px solid #31313c;border-radius:12px;padding:8px 11px;font-size:13px}.person-chip b{font-weight:700}.person-chip small{font-size:11px;color:#a3a1b0}.empty-inline{font-size:13px;color:var(--muted-2);padding:5px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head .eyebrow{color:var(--lav)}.section-hint{margin:0 0 1px;color:var(--muted-2);font-size:12px}.project-list{overflow:hidden}.project-row+.project-row{border-top:1px solid var(--line)}.project-row details{width:100%}.project-row summary{list-style:none;display:flex;align-items:center;gap:16px;min-height:78px;padding:16px 21px;cursor:pointer}.project-row summary::-webkit-details-marker{display:none}.project-row summary:hover{background:#191920}.project-name{font-size:16px;font-weight:750;min-width:150px;letter-spacing:-.04em}.project-meta{display:flex;flex:1;align-items:center;gap:8px;flex-wrap:wrap}.metric-pill{display:inline-flex;align-items:center;gap:6px;background:#25212f;border:1px solid #393147;border-radius:999px;padding:5px 10px;font-size:12px;color:#d3c5ff;font-weight:650}.metric-pill.expected{background:#172a25;border-color:#284338;color:#a5e8d1}.metric-pill em{font-style:normal;font-weight:800;color:var(--lav)}.metric-pill.expected em{color:var(--green)}.chevron{width:31px;height:31px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:#23232b;color:#bbb9c8;font-size:15px;transition:transform .18s ease}details[open] .chevron{transform:rotate(180deg);background:#302a3c;color:var(--lav)}.project-body{padding:0 22px 20px}.parts{border-top:1px solid var(--line)}.part-row{display:grid;grid-template-columns:minmax(160px,1fr) minmax(145px,.7fr) minmax(280px,2fr);gap:15px;align-items:start;padding:14px 4px;border-bottom:1px solid #262630}.part-row:last-child{border-bottom:0}.part-name{font-size:13px;font-weight:700;color:#e7e5ee;padding-top:3px}.open-count{font-size:12px;color:#b9b7c4}.open-count strong{font-size:15px;color:var(--lav);font-weight:760}.part-people{display:flex;flex-wrap:wrap;gap:7px}.small-person{display:inline-flex;align-items:center;gap:8px;background:#211d2b;border:1px solid #383047;color:#e0d8ff;border-radius:9px;padding:5px 9px;font-size:12px}.small-person time{color:#a7a0b8;font-size:11px}.no-people{font-size:12px;color:var(--muted-2);padding-top:4px}.part-empty{padding:20px 4px;color:var(--muted);font-size:13px}.status-line{display:flex;justify-content:center;align-items:center;min-height:25px;margin-top:17px;color:var(--muted-2);font-size:11px}.status-dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin:0 7px 1px 0}.status-line.error{color:var(--red)}.status-line.error .status-dot{background:var(--red)}.footer-note{text-align:center;color:#696976;font-size:10px;margin-top:22px}
@media(max-width:760px){main{padding:20px 14px 48px}.topbar{align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:20px}.brand{gap:10px}.brand-logo{width:84px;height:51px}.brand-copy strong{font-size:13px}.brand-copy span{font-size:9px;letter-spacing:.1em}.top-actions{gap:6px}.select-wrap select{max-width:135px;padding:9px 28px 9px 10px;font-size:12px}.sheet-link{display:none}.icon-button{width:36px;height:36px}.week-panel{padding:19px 15px 17px;margin-bottom:34px;border-radius:17px}.panel-head{align-items:flex-start;flex-direction:column;margin-bottom:14px}.panel-head h1,.section-title{font-size:19px}.week-switch{align-self:flex-end;margin-top:-4px}.kpis{gap:7px}.kpi{padding:13px 10px;min-height:95px;border-radius:13px}.kpi-label{font-size:11px}.kpi-value{font-size:24px;margin-top:8px}.kpi-value span{font-size:12px}.kpi-note{font-size:9px}.weekly-list-head{align-items:flex-start;flex-direction:column;gap:3px}.person-chip{align-items:flex-start;flex-direction:column;gap:2px;font-size:12px;padding:8px 9px}.person-chip small{font-size:10px}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.section-hint{font-size:11px}.project-row summary{padding:14px 13px;gap:9px;min-height:70px}.project-name{min-width:90px;font-size:14px}.project-meta{gap:5px}.metric-pill{font-size:10px;padding:5px 7px}.project-body{padding:0 13px 14px}.part-row{grid-template-columns:minmax(110px,.9fr) minmax(102px,.8fr);gap:7px;padding:12px 2px}.part-name{font-size:12px}.open-count{font-size:11px;text-align:right}.open-count strong{font-size:13px}.part-people{grid-column:1/-1;padding-left:2px}.chevron{width:26px;height:26px}}
@media(max-width:410px){.brand-logo{width:70px;height:43px}.brand-copy strong{font-size:11px}.brand-copy span{font-size:8px}.select-wrap select{max-width:115px}.kpi-value{font-size:21px}.project-name{min-width:78px}.metric-pill{font-size:9px;padding:4px 6px}}
</style>
</head>
<body>
<main>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="kong-studios-logo.png" alt="KONG STUDIOS 로고"><div class="brand-copy"><strong>KONGSTUDIOS</strong><span>RECRUITING DASHBOARD</span></div></div>
  <div class="top-actions"><div class="select-wrap"><select id="projectFilter" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option></select></div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1c0x-dBPGGjDTPAXiO84-H-iwytpwy3WOAG05ogsXBuk/edit" target="_blank" rel="noopener">채용 시트 ↗</a><button class="icon-button" id="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button></div>
</header>
<section class="week-panel" aria-labelledby="weeklyTitle">
  <div class="panel-head"><div><p class="eyebrow">WEEKLY REPORT</p><h1 id="weeklyTitle">이번 주 채용 요약</h1></div><div class="week-switch"><button id="prevWeek" type="button" aria-label="이전 주">‹</button><span class="week-range" id="weekRange"></span><button id="nextWeek" type="button" aria-label="다음 주">›</button></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="weekly-list"><div class="weekly-list-head"><strong>이번 주 입사 예정자</strong><span id="weeklyHint"></span></div><div class="weekly-people" id="weeklyPeople"></div></div>
</section>
<section aria-labelledby="projectsTitle"><div class="section-head"><div><p class="eyebrow">PROJECT OVERVIEW</p><h2 class="section-title" id="projectsTitle">프로젝트별 채용 현황</h2></div><p class="section-hint">프로젝트를 선택하면 채용 중인 파트와 입사 예정자를 볼 수 있어요.</p></div><div class="project-list" id="projects"></div></section>
<div class="status-line" id="status" role="status" aria-live="polite"></div><p class="footer-note">시트에 등록된 채용 승인 및 입사 예정 정보 기준</p>
</main>
<script src="config.js"></script>
<script>
const API_URL=(typeof DATA_URL!=='undefined'&&DATA_URL)?DATA_URL:(window.DATA_URL||'');
const $=id=>document.getElementById(id);let data=null,weekOffset=0;
const fmtDate=s=>{if(!s)return '일정 미정';const d=new Date(`${s}T00:00:00+09:00`);return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).format(d)};
const weekBounds=()=>{const local=new Date(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00Z');const weekday=(local.getUTCDay()+6)%7;local.setUTCDate(local.getUTCDate()-weekday+weekOffset*7);const start=local.toISOString().slice(0,10);local.setUTCDate(local.getUTCDate()+6);return{start,end:local.toISOString().slice(0,10)}};
const within=(date,start,end)=>Boolean(date&&start<=date&&date<=end);const PROJECT_TABS=['ZERO','HERO','OTPS','MAZE','N-GDTS','Art실','KongPlay','Server','IT Infra','QA','Publishing'];const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};const entrants=()=>data?.entrants||[];
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function groupProjects(parts){const map=new Map();for(const part of parts){const project=String(part.project||'').trim(),team=String(part.team||'').trim();if(!project||!team)continue;if(!map.has(project))map.set(project,{project,parts:[]});map.get(project).parts.push({...part,project,team,to:num(part.to),hc:num(part.hc),open:num(part.open),planned:num(part.planned)});}return [...map.values()];}
function normalizePayload(payload){
  if(!payload||payload.error)throw new Error('server');
  if(!Array.isArray(payload.parts))throw new Error('schema');
  const normalizePart=p=>({...p,project:String(p.project||'').trim(),team:String(p.team||'').trim(),open:num(p.open),planned:num(p.planned)});
  const flatParts=payload.parts.map(normalizePart);
  if(!Array.isArray(payload.daily))payload.daily=[];
  if(Array.isArray(payload.entrants)){payload.legacy=false;}
  else{
    const list=[];
    for(const part of flatParts){
      const raw=String(part.arrivals||'').trim();if(!raw)continue;
      for(const item of raw.split(/\s*[·•]\s*/)){
        const text=item.trim(),match=text.match(/^(.*?)\s*\((\d{4}-\d{2}-\d{2})\)$/),name=(match?match[1]:text).trim();
        if(name&&!/^[-—]+$/.test(name))list.push({name,date:match?match[2]:'',project:part.project,team:part.team,status:'입사예정'});
      }
    }
    payload.entrants=list;payload.legacy=true;
  }
  const sourceProjects=Array.isArray(payload.projects)&&payload.projects.length
    ? payload.projects.map(project=>({project:String(project.project||'').trim(),parts:(project.parts||[]).map(normalizePart)})).filter(project=>project.project)
    : groupProjects(flatParts);
  const byName=new Map(sourceProjects.map(project=>[project.project,project]));
  payload.projects=PROJECT_TABS.map(project=>byName.get(project)||{project,parts:[]}).concat(sourceProjects.filter(project=>!PROJECT_TABS.includes(project.project)));
  payload.parts=payload.projects.flatMap(project=>project.parts);
  payload.receivedProjectCount=num(payload.projectCount)||sourceProjects.filter(project=>project.parts.length).length;
  if(!payload.parts.length)throw new Error('empty');
  return payload;
}
function metric(label,value,note,accent=false){const card=el('div',undefined,`kpi${accent?' accent':''}`);card.append(el('div',label,'kpi-label'));const numel=el('div',undefined,'kpi-value');numel.append(document.createTextNode(String(value)),el('span','명'));card.append(numel,el('div',note,'kpi-note'));return card;}
function renderWeekly(projects){const {start,end}=weekBounds();$('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;const names=new Set(projects.map(x=>x.project));const relevant=data.parts.filter(x=>names.has(x.project));const open=relevant.reduce((s,x)=>s+num(x.open),0);const incoming=entrants().filter(x=>x.status==='입사예정'&&within(x.date,start,end)&&names.has(x.project));const complete=data.legacy?data.daily.filter(x=>within(x.day,start,end)&&names.has(x.project)).reduce((s,x)=>s+num(x.count),0):entrants().filter(x=>x.status==='채용완료'&&within(x.date,start,end)&&names.has(x.project)).length;$('kpis').replaceChildren(metric('채용 중인 TO',open,'진행 중 승인 인원',true),metric('이번 주 입사 예정',incoming.length,'예정일 기준'),metric('이번 주 입사 완료',complete,'입사 처리 완료 기준'));const list=$('weeklyPeople');list.replaceChildren();$('weeklyHint').textContent=`${fmtDate(start)} – ${fmtDate(end)}`;if(!incoming.length){list.append(el('div','이번 주 입사 예정자가 없습니다.','empty-inline'));return;}for(const p of incoming.sort((a,b)=>(a.date||'').localeCompare(b.date||''))){const chip=el('div',undefined,'person-chip');chip.append(el('b',p.name),el('small',`${p.project} · ${p.team} · ${fmtDate(p.date)}`));list.append(chip);}}
function renderProjects(){if(!data)return;const selected=$('projectFilter').value;const projects=data.projects.filter(p=>!selected||p.project===selected);renderWeekly(projects);const root=$('projects');root.replaceChildren();if(!projects.length){root.append(el('div','표시할 프로젝트가 없습니다.','part-empty'));return;}for(const item of projects){const activeNames=entrants().filter(x=>x.status==='입사예정'&&x.project===item.project);const activeCount=item.parts.reduce((s,p)=>s+num(p.open),0);const plannedCount=item.parts.reduce((s,p)=>s+num(p.planned),0)||activeNames.length;const section=el('section',undefined,'project-row');const details=document.createElement('details'),summary=document.createElement('summary');summary.append(el('span',item.project,'project-name'));const pills=el('span',undefined,'project-meta');const openPill=el('span',undefined,'metric-pill');openPill.append(document.createTextNode('채용 중 '),el('em',`${activeCount}명`));const planPill=el('span',undefined,'metric-pill expected');planPill.append(document.createTextNode('입사 예정 '),el('em',`${plannedCount}명`));pills.append(openPill,planPill);summary.append(pills,el('span','⌄','chevron'));const body=el('div',undefined,'project-body'),partList=el('div',undefined,'parts');const visible=item.parts.filter(p=>num(p.open)>0||num(p.planned)>0||entrants().some(x=>x.status==='입사예정'&&x.project===item.project&&x.team===p.team));if(!visible.length)partList.append(el(item.parts.length?'현재 채용 중이거나 입사 예정인 파트가 없습니다.':'프로젝트 데이터를 받지 못했습니다. Apps Script 최신 버전을 배포해 주세요.','part-empty'));for(const p of visible){const row=el('div',undefined,'part-row');row.append(el('div',p.team,'part-name'));const count=el('div',undefined,'open-count');count.append(document.createTextNode('채용 중 '),el('strong',`${num(p.open)}명`));row.append(count);const people=el('div',undefined,'part-people');const planned=entrants().filter(x=>x.status==='입사예정'&&x.project===item.project&&x.team===p.team).sort((a,b)=>(a.date||'').localeCompare(b.date||''));if(planned.length){for(const person of planned){const chip=el('span',undefined,'small-person');chip.append(document.createTextNode(person.name),el('time',fmtDate(person.date)));people.append(chip);}}else people.append(el('span',num(p.planned)>0?'입사 예정 정보 확인 필요':'입사 예정자 없음','no-people'));row.append(people);partList.append(row);}body.append(partList);details.append(summary,body);section.append(details);root.append(section);}}
function status(message,error=false){const s=$('status');s.replaceChildren();if(!error)s.append(el('span',undefined,'status-dot'));s.append(document.createTextNode(message));s.classList.toggle('error',error);}
async function load(){if(!API_URL){status('config.js의 웹 앱 주소를 확인해 주세요.',true);return;}const button=$('refresh');button.disabled=true;status('데이터를 불러오는 중입니다.');try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error('network');data=normalizePayload(await response.json());const select=$('projectFilter'),old=select.value;select.replaceChildren(new Option('전체 프로젝트',''));for(const p of data.projects)select.add(new Option(p.project,p.project));select.value=[...select.options].some(o=>o.value===old)?old:'';renderProjects();const received=data.receivedProjectCount;status(received<PROJECT_TABS.length?`프로젝트 데이터 ${received}/${PROJECT_TABS.length}개 수신 · Apps Script 최신 버전 배포가 필요합니다.`:`프로젝트 ${received}개 연결 · ${new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}`,received<PROJECT_TABS.length);}catch(error){const msg=error.message==='empty'?'프로젝트별 데이터가 비어 있습니다. Apps Script에서 PublicDashboard.gs를 최신 버전으로 배포해 주세요.':error.message==='schema'?'공개 웹 앱 응답 형식이 맞지 않습니다. Apps Script를 최신 버전으로 배포해 주세요.':error.message==='server'?'Apps Script 공개 웹 앱이 오류 응답을 반환했습니다. PublicDashboard.gs를 교체하고 새 버전으로 배포해 주세요.':'데이터를 불러오지 못했습니다. 웹 앱 주소와 공개 접근 설정을 확인해 주세요.';status(msg,true);}finally{button.disabled=false;}}
$('refresh').addEventListener('click',load);$('projectFilter').addEventListener('change',renderProjects);$('prevWeek').addEventListener('click',()=>{weekOffset--;if(data)renderProjects();});$('nextWeek').addEventListener('click',()=>{weekOffset++;if(data)renderProjects();});load();
</script>
</body>
</html>
